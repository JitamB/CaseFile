name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every internal link resolves to a committed file
        run: python tools/check_links.py

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CI never reaches the network for a model call. The LLM layer replays
      # from llm_cache/ instead — see §43.
      - name: ground_truth.json is imported only by tests/
        run: python tools/check_ground_truth_isolation.py

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy src

      - name: Tests
        env:
          CASEFILE_LLM_REPLAY: "true"
        run: pytest -q

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Tests
        working-directory: ui
        run: npm test

      # Type-checks and builds against fixtures/ at the repo root — see
      # vite.config.ts's @fixtures alias — so a fixture the screen no longer
      # matches breaks this job rather than surfacing at G3.
      - name: Build
        working-directory: ui
        run: npm run build
