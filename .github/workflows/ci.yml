name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every internal link resolves to a committed file
        run: python tools/check_links.py

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CI never reaches the network for a model call. The LLM layer replays
      # from llm_cache/ instead — see §43.
      - name: ground_truth.json is imported only by tests/
        run: python tools/check_ground_truth_isolation.py

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy src

      - name: Tests
        env:
          CASEFILE_LLM_REPLAY: "true"
        run: pytest -q
