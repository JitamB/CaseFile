[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "casefile"
version = "0.1.0"
description = "An automatic investigator for business numbers."
requires-python = ">=3.11"

# Kept as small as the ladder allows. CI installs `.[dev]`, which installs these
# too, so anything here is paid for on every push and every PR. The rule is that
# a library lands here only when a step's verify command needs it to run in CI.
#
# statsmodels and scipy arrive at ladder step 1.1: §15 S1's materiality gate is
# STL then robust-z, and its tests are the step's verify command. They cost about
# 50 MB and a few seconds. sentence-transformers stays out — ~2 GB of torch for a
# ranking job over ~900 documents, behind the `embed` extra CI does not install.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",  # mypy runs on src/ in CI; contract.py imports yaml
  "scipy-stubs>=1.11",  # scipy ships no py.typed; stubs exist, so use them
]

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# statsmodels ships no py.typed marker, so mypy cannot see into it. The choice
# is between this and an inline ignore on every import; a named override says
# "this library is untyped upstream" once, where an inline ignore reads as "this
# line is a problem" at each call site.
[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# We write function-style tests only. Without this, pytest tries to collect the
# `TestResult` and `TestMatrix` models (§14.3, §15 S5) as test classes and warns
# on every run — and those names are the treaty's, not ours to rename.
python_classes = []

# §43 — phase gates are pytest markers, not meetings. Registered here so
# `make gateN` never warns, and so a gate that has been met cannot silently
# regress once its marker joins the required checks on main.
markers = [
  "gate0: G0 — contracts and fixtures validate; make data reproducible",
  "gate1: G1 — deterministic spine; scenarios D and E close with zero model calls",
  "gate2: G2 — evidence and challenge; A Likely, B Undetermined, G Contested",
  "gate3: G3 — surface; make demo end to end, security test green, budget met",
  "gate4: G4 — learning; feedback shifts depth and order, contract gap promoted",
  "gate5: G5 — optional scope",
  "gate6: G6 — fresh clone on a clean machine",
]
